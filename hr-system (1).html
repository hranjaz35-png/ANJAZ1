<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إنجاز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --navy: #16233F;
    --navy-2: #1E3157;
    --gold: #C9962E;
    --gold-2: #E0B04D;
    --green: #2E8B6C;
    --red: #C1473F;
    --bg: #F3F1EA;
    --card: #FFFFFF;
    --ink: #1C1F26;
    --muted: #6B7280;
    --line: #E6E2D6;
    --radius: 14px;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #14171C;
      --card: #1D2129;
      --ink: #ECEAE3;
      --muted: #9AA0AC;
      --line: #2B3038;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171C;
    --card: #1D2129;
    --ink: #ECEAE3;
    --muted: #9AA0AC;
    --line: #2B3038;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Cairo', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Login ---------- */
  .login-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(circle at 30% 15%, var(--navy-2), var(--navy) 65%);
    color: #F4F1E8;
  }
  .login-mark {
    width: 116px; height: 116px; border-radius: 22px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .login-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .login-title { font-size: 24px; font-weight: 800; margin: 0 0 4px; text-align: center; }
  .login-sub { color: #C7C2AE; font-size: 14.5px; margin: 0 0 28px; text-align: center; max-width: 320px; line-height: 1.6; }
  .login-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 360px;
    backdrop-filter: blur(6px);
  }
  .field-label { font-size: 13px; color: #D8D4C4; margin-bottom: 6px; display: block; font-weight: 600; }
  input, select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .login-card input {
    background: rgba(255,255,255,0.95);
    border: none;
    color: #14171C;
    letter-spacing: 1px;
    text-align: center;
    font-weight: 700;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  .btn {
    appearance: none; border: none; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 15px;
    border-radius: 10px; padding: 13px 18px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #201400; width: 100%; margin-top: 16px; }
  .btn-outline { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
  .btn-ghost { background: var(--bg); color: var(--ink); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-sm { padding: 9px 12px; font-size: 13.5px; border-radius: 9px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .login-error { color: #FFB4AC; font-size: 13.5px; margin-top: 12px; text-align: center; min-height: 18px; }
  .login-hint { margin-top: 22px; color: #9C9880; font-size: 12.5px; text-align: center; line-height: 1.6; }

  /* ---------- Shell ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--navy); color: #fff;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-title { font-size: 17px; font-weight: 800; }
  .topbar-sub { font-size: 12px; color: #C7C2AE; margin-top: 2px; }
  .topbar-logout { background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }

  main { flex: 1; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; width: 100%; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title { font-size: 15.5px; font-weight: 800; margin: 0 0 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty-state { text-align: center; padding: 36px 16px; color: var(--muted); }
  .empty-state .emoji { font-size: 32px; margin-bottom: 8px; display: block; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .badge-wait { background: #FBF0DA; color: #96690B; }
  .badge-hr { background: #E4ECF7; color: #2A5599; }
  .badge-ok { background: #E3F3EA; color: #1E7A54; }
  .badge-no { background: #FBE7E4; color: #A6362C; }
  :root[data-theme="dark"] .badge-wait, :root:not([data-theme="light"]) .badge-wait { background: #3A2E14; color: #E7B15C; }
  :root[data-theme="dark"] .badge-hr, :root:not([data-theme="light"]) .badge-hr { background: #1B2C46; color: #8FB3E8; }
  :root[data-theme="dark"] .badge-ok, :root:not([data-theme="light"]) .badge-ok { background: #17332570; color: #7FCBA5; }
  :root[data-theme="dark"] .badge-no, :root:not([data-theme="light"]) .badge-no { background: #3B211E; color: #E79187; }

  .req-item { border: 1px solid var(--line); border-radius: 12px; padding: 13px; margin-bottom: 10px; }
  .req-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .req-type { font-weight: 800; font-size: 14.5px; }
  .req-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .req-reason { font-size: 13.5px; margin-bottom: 10px; line-height: 1.6; }
  .req-actions { display: flex; gap: 8px; }
  .req-note { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; }

  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: none; }
  .li-name { font-weight: 700; font-size: 14px; }
  .li-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .li-code { font-size: 12px; color: var(--gold); font-weight: 700; background: rgba(201,150,46,0.12); padding: 2px 8px; border-radius: 6px; }

  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .summary-box { background: var(--bg); border-radius: 12px; padding: 14px; text-align: center; }
  .summary-num { font-size: 22px; font-weight: 900; }
  .summary-cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .summary-box.warn .summary-num { color: var(--red); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tab-btn {
    flex: 1; background: none; border: none; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; color: var(--muted); font-size: 11px; font-weight: 700; border-radius: 10px;
  }
  .tab-btn .ic { font-size: 19px; }
  .tab-btn.active { color: var(--gold); }

  .toast {
    position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    z-index: 50; box-shadow: 0 8px 20px rgba(0,0,0,0.25); max-width: 88%; text-align: center;
  }
  .type-select { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-opt {
    border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 8px; text-align: center;
    font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink); background: var(--card);
  }
  .type-opt.sel { border-color: var(--gold); background: rgba(201,150,46,0.1); color: #96690B; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .link-btn { background: none; border: none; color: var(--gold); font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; padding: 4px; }
  .banner {
    background: #FBF0DA; color: #7A5300; border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; line-height: 1.6;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  var db = null;
  var user = null; // {code,name,role,managerCode,baseSalary}
  var ready = false;

  var MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var TYPE_LABELS = {
    leave: "إجازة",
    permission: "استئذان",
    late: "تأخير حضور",
    early: "انصراف مبكر"
  };
  var STATUS_LABELS = {
    pending_manager: { text: "بانتظار المدير", cls: "badge-wait" },
    pending_hr: { text: "بانتظار الموارد البشرية", cls: "badge-hr" },
    approved: { text: "تمت الموافقة", cls: "badge-ok" },
    rejected: { text: "مرفوض", cls: "badge-no" }
  };

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){
      if (c === null || c === undefined) return;
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }
  function fmtMoney(n){
    n = Math.round(n*100)/100;
    return n.toLocaleString("ar-EG");
  }
  function todayStr(){
    var d = new Date();
    return d.toISOString().slice(0,10);
  }
  function currentMonthKey(){ return todayStr().slice(0,7); }
  function monthLabel(mk){
    var parts = mk.split("-");
    var idx = parseInt(parts[1],10)-1;
    return (MONTHS_AR[idx]||"") + " " + parts[0];
  }
  function showToast(msg){
    var t = el("div", {class:"toast"}, [msg]);
    document.getElementById("app").appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }
  function saveSession(){
    try { sessionStorage.setItem("hr_session_code", user.code); } catch(e){}
  }
  function clearSession(){
    try { sessionStorage.removeItem("hr_session_code"); } catch(e){}
  }
  function loadSessionCode(){
    try { return sessionStorage.getItem("hr_session_code"); } catch(e){ return null; }
  }

  // ---------- DB helpers ----------
  function empRef(code){ return db.collection("employees").doc(code); }
  function reqCol(){ return db.collection("requests"); }
  function notifCol(){ return db.collection("notifications"); }
  function attCol(){ return db.collection("attendance"); }
  function adjCol(){ return db.collection("adjustments"); }

  function notify(toCode, message, subject){
    if (!toCode) return Promise.resolve();
    var p1 = notifCol().add({ toCode: toCode, message: message, read: false, createdAt: Date.now() }).catch(function(){});
    var p2 = getEmployee(toCode).then(function(emp){
      if (emp && emp.email){
        return trySendEmail(emp.email, subject || "إشعار من نظام Anjaz Agency", message);
      }
    }).catch(function(){});
    return Promise.all([p1, p2]);
  }

  function trySendEmail(to, subject, body){
    if (typeof claude === "undefined" || !claude.use) return Promise.resolve(false);
    return claude.use("mcp").then(function(mcp){
      if (!mcp) return false;
      return mcp.callTool("Gmail", "send_message", { to: [to], subject: subject, body: body })
        .then(function(){ return true; })
        .catch(function(){ return false; });
    }).catch(function(){ return false; });
  }

  function getEmployee(code){
    return empRef(code).get().then(function(snap){
      return snap.exists ? Object.assign({code: snap.id}, snap.data()) : null;
    });
  }
  function listByRole(role){
    return db.collection("employees").where("role","==",role).get().then(function(qs){
      return qs.docs.map(function(d){ return Object.assign({code:d.id}, d.data()); });
    });
  }
  function listRequestsFor(field, value){
    return reqCol().where(field,"==",value).get().then(function(qs){
      var arr = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      arr.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      return arr;
    });
  }

  function computeSummary(requests, monthKey, employee, adjustments, attendanceRecords){
    employee = employee || {};
    adjustments = adjustments || [];
    attendanceRecords = attendanceRecords || [];
    var baseSalary = employee.baseSalary;
    var approved = requests.filter(function(r){
      return r.status === "approved" && (r.date||"").slice(0,7) === monthKey;
    });
    var leaveDays = approved.filter(function(r){ return r.type==="leave"; }).length;
    var hoursUsed = approved.filter(function(r){ return r.type==="hours"; })
      .reduce(function(s,r){ return s + (Number(r.hours)||0); }, 0);

    var extraLeave = Math.max(0, leaveDays - 2);
    var deductDaysFromLeave = extraLeave * 1;

    var extraHours = Math.max(0, hoursUsed - 5);
    var wholeExtra = Math.ceil(extraHours - 1e-9);
    var deductDaysFromHours = 0;
    for (var i=1;i<=wholeExtra;i++){
      if (i===1) deductDaysFromHours += 0.25;
      else if (i===2) deductDaysFromHours += 0.5;
      else deductDaysFromHours += 1;
    }

    // Attendance-based unexcused absences: work day (Sun–Thu) with no clock-in
    // and no approved leave request covering it — deducted as a full day each.
    var coveredDates = {};
    approved.filter(function(r){ return r.type==="leave"; }).forEach(function(r){ coveredDates[r.date] = true; });
    var checkedInDates = {};
    attendanceRecords.forEach(function(a){ if (a.checkIn) checkedInDates[a.date] = true; });
    var parts = monthKey.split("-");
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    var daysInMonth = new Date(y, m, 0).getDate();
    var today = todayStr();
    var absentDays = 0;
    for (var d=1; d<=daysInMonth; d++){
      var dateStr = monthKey + "-" + (d<10?"0"+d:d);
      if (dateStr > today) break; // don't count future days
      var dow = new Date(y, m-1, d).getDay(); // 0=Sun ... 6=Sat
      if (dow===5 || dow===6) continue; // Fri/Sat weekend
      if (coveredDates[dateStr]) continue;
      if (checkedInDates[dateStr]) continue;
      absentDays++;
    }

    var totalDays = deductDaysFromLeave + deductDaysFromHours + absentDays;
    var dailyRate = (Number(baseSalary)||0) / 30;
    var deductAmount = totalDays*dailyRate;

    var monthAdj = adjustments.filter(function(a){ return a.month === monthKey; });
    var bonusSum = monthAdj.filter(function(a){ return a.type==="bonus"; }).reduce(function(s,a){ return s+(Number(a.amount)||0); }, 0);
    var manualDeductSum = monthAdj.filter(function(a){ return a.type==="deduction"; }).reduce(function(s,a){ return s+(Number(a.amount)||0); }, 0);
    var allowances = Number(employee.allowances)||0;
    var fixedDeduction = Number(employee.fixedDeduction)||0;

    var netSalary = baseSalary ? (Number(baseSalary) + allowances - fixedDeduction - deductAmount + bonusSum - manualDeductSum) : null;

    return {
      leaveDays: leaveDays, hoursUsed: hoursUsed,
      extraLeave: extraLeave, extraHours: extraHours,
      absentDays: absentDays,
      deductDays: totalDays, deductAmount: deductAmount,
      dailyRate: dailyRate,
      allowances: allowances, fixedDeduction: fixedDeduction,
      bonusSum: bonusSum, manualDeductSum: manualDeductSum,
      netSalary: netSalary
    };
  }

  // ---------- Seed HR ----------
  function ensureSeed(){
    return listByRole("hr").then(function(list){
      if (list.length === 0){
        return empRef("HR").set({ name:"الموارد البشرية", role:"hr", pin:"1234", email:"amra28256@gmail.com", createdAt: Date.now() });
      }
    });
  }

  // ---------- Render root ----------
  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";
    if (!user){ app.appendChild(renderLogin()); return; }
    app.appendChild(renderShell());
  }

  // ================= LOGIN =================
  function renderLogin(){
    var errBox;
    var input, pinInput;
    function doLogin(){
      var code = (input.value||"").trim();
      var pin = (pinInput.value||"").trim();
      errBox.textContent = "";
      if (!code || !pin){ errBox.textContent = "اكتب الكود والرقم السري"; return; }
      if (!db){ errBox.textContent = "التطبيق مش متصل بقاعدة البيانات دلوقتي"; return; }
      loginBtn.disabled = true;
      getEmployee(code).then(function(emp){
        loginBtn.disabled = false;
        if (!emp){ errBox.textContent = "الكود ده مش مسجل"; return; }
        if (String(emp.pin||"") !== pin){ errBox.textContent = "الرقم السري غلط"; return; }
        user = emp;
        saveSession();
        state.tab = defaultTab();
        render();
      }).catch(function(){
        loginBtn.disabled = false;
        errBox.textContent = "حصل خطأ، حاول تاني";
      });
    }
    input = el("input", {placeholder:"الكود", type:"text", inputmode:"latin", onkeydown:function(ev){ if(ev.key==="Enter") pinInput.focus(); }});
    pinInput = el("input", {placeholder:"الرقم السري", type:"password", inputmode:"numeric", style:"margin-top:10px;", onkeydown:function(ev){ if(ev.key==="Enter") doLogin(); }});
    errBox = el("div", {class:"login-error"}, [""]);

  // ================= SHELL / TABS =================
  var state = { tab: null, month: currentMonthKey(), draft: {} };

  function defaultTab(){
    if (user.role === "hr") return "hr-approve";
    if (user.role === "manager") return "mg-approve";
    return "em-new";
  }

  function tabsFor(){
    if (user.role === "hr") return [
      {id:"hr-approve", ic:"✅", label:"الموافقات"},
      {id:"hr-employees", ic:"👥", label:"الموظفين"},
      {id:"hr-managers", ic:"🧑‍💼", label:"المديرين"},
      {id:"hr-attend", ic:"⏱️", label:"الحضور"},
      {id:"hr-adjust", ic:"💰", label:"مكافآت وخصومات"},
      {id:"hr-report", ic:"📊", label:"التقرير"}
    ];
    if (user.role === "manager") return [
      {id:"mg-approve", ic:"✅", label:"الموافقات"},
      {id:"mg-team", ic:"👥", label:"فريقي"},
      {id:"mg-history", ic:"🗂️", label:"السجل"}
    ];
    return [
      {id:"em-attend", ic:"⏱️", label:"الحضور"},
      {id:"em-new", ic:"➕", label:"طلب جديد"},
      {id:"em-mine", ic:"📋", label:"طلباتي"},
      {id:"em-summary", ic:"📊", label:"ملخصي"}
    ];
  }

  function roleLabel(r){
    return r==="hr" ? "الموارد البشرية" : (r==="manager" ? "مدير مباشر" : "موظف");
  }

  function renderShell(){
    var wrap = el("div", {});
    var bellBtn = el("button", {class:"topbar-logout", style:"position:relative;", onclick:function(){ state.tab="notifications"; render(); }}, ["🔔"]);
    var top = el("div", {class:"topbar"}, [
      el("div", {}, [
        el("div", {class:"topbar-title"}, [user.name || user.code]),
        el("div", {class:"topbar-sub"}, [roleLabel(user.role) + " · كود " + user.code])
      ]),
      el("div", {style:"display:flex;gap:8px;"}, [
        bellBtn,
        el("button", {class:"topbar-logout", onclick:function(){ state.tab="settings"; render(); }}, ["⚙️"]),
        el("button", {class:"topbar-logout", onclick:function(){ user=null; clearSession(); render(); }}, ["خروج"])
      ])
    ]);
    var main = el("main", {id:"main-area"}, []);
    var tabs = tabsFor();
    var bar = el("div", {class:"tabbar"}, tabs.map(function(t){
      return el("button", {
        class: "tab-btn" + (state.tab===t.id ? " active":""),
        onclick: function(){ state.tab = t.id; render(); }
      }, [ el("span",{class:"ic"},[t.ic]), el("span",{},[t.label]) ]);
    }));
    wrap.appendChild(top);
    wrap.appendChild(main);
    wrap.appendChild(bar);

    notifCol().where("toCode","==",user.code).where("read","==",false).get().then(function(qs){
      if (qs.size > 0){
        bellBtn.appendChild(el("span", {style:"position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;"}, [String(qs.size)]));
      }
    }).catch(function(){});

    setTimeout(function(){ mountTab(main); }, 0);
    return wrap;
  }

  function mountTab(main){
    main.innerHTML = "";
    main.appendChild(el("div", {class:"muted", html:"جاري التحميل…"}));
    var fn = {
      "em-new": viewEmployeeNew,
      "em-mine": viewEmployeeMine,
      "em-summary": viewEmployeeSummary,
      "em-attend": viewEmployeeAttend,
      "mg-approve": viewManagerApprove,
      "mg-team": viewManagerTeam,
      "mg-history": viewManagerHistory,
      "hr-approve": viewHrApprove,
      "hr-employees": viewHrEmployees,
      "hr-managers": viewHrManagers,
      "hr-attend": viewHrAttend,
      "hr-adjust": viewHrAdjustments,
      "hr-report": viewHrReport,
      "settings": viewSettings,
      "notifications": viewNotifications
    }[state.tab];
    if (fn) fn(main);
  }

  function reload(){ mountTab(document.getElementById("main-area")); }

  // ================= NOTIFICATIONS =================
  function viewNotifications(main){
    main.innerHTML = "";
    main.appendChild(el("div", {class:"section-head"}, [
      el("h3",{},["الإشعارات"]),
      el("button",{class:"link-btn", onclick:function(){ state.tab = defaultTab(); render(); }}, ["رجوع"])
    ]));
    var box = el("div", {class:"muted"}, ["جاري التحميل…"]);
    main.appendChild(box);
    notifCol().where("toCode","==",user.code).get().then(function(qs){
      var list = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      box.innerHTML = "";
      if (list.length===0){ box.appendChild(emptyState("🔔","مفيش إشعارات دلوقتي")); return; }
      var card = el("div", {class:"card"}, []);
      list.forEach(function(n){
        var item = el("div", {class:"req-item", style: n.read ? "opacity:.6;" : "border-color:var(--gold);"}, [
          el("div", {class:"req-reason", style:"margin-bottom:4px;"}, [n.message]),
          el("div", {class:"req-meta"}, [new Date(n.createdAt||Date.now()).toLocaleString("ar-EG")])
        ]);
        card.appendChild(item);
        if (!n.read){
          notifCol().doc(n.id).update({ read: true }).catch(function(){});
        }
      });
      main.appendChild(card);
    });
  }

  // ================= SETTINGS (change PIN) =================
  function viewSettings(main){
    main.innerHTML = "";
    var oldPin = el("input", {type:"password", inputmode:"numeric", placeholder:"الرقم السري الحالي"});
    var newPin = el("input", {type:"password", inputmode:"numeric", placeholder:"الرقم السري الجديد"});
    var msg = el("div", {class:"login-error", style:"color:var(--red);"}, [""]);
    var saveBtn = el("button", {class:"btn btn-primary", onclick:function(){
      msg.textContent = "";
      if (String(user.pin||"") !== oldPin.value.trim()){ msg.textContent = "الرقم السري الحالي غلط"; return; }
      var np = newPin.value.trim();
      if (!np || np.length < 4){ msg.textContent = "اكتب رقم سري 4 أرقام على الأقل"; return; }
      saveBtn.disabled = true;
      empRef(user.code).update({ pin: np }).then(function(){
        user.pin = np;
        showToast("تم تغيير الرقم السري");
        state.tab = defaultTab();
        render();
      }).catch(function(){ msg.textContent = "حصل خطأ"; saveBtn.disabled=false; });
    }}, ["حفظ"]);

    main.appendChild(el("div", {class:"section-head"}, [
      el("h3",{},["الإعدادات"]),
      el("button",{class:"link-btn", onclick:function(){ state.tab = defaultTab(); render(); }}, ["رجوع"])
    ]));
    main.appendChild(el("div", {class:"card"}, [
      el("div",{class:"card-title"},["تغيير الرقم السري"]),
      el("div",{class:"field"},[el("label",{class:"field-label"},["الرقم السري الحالي"]), oldPin]),
      el("div",{class:"field"},[el("label",{class:"field-label"},["الرقم السري الجديد"]), newPin]),
      saveBtn,
      msg
    ]));

  function resetAllData(){

      db.collection("employees").get(),

  // ================= EMPLOYEE: ATTENDANCE (CLOCK IN/OUT) =================
  function attDocId(code, date){ return code + "_" + date; }

  function getLocation(){
    return new Promise(function(resolve){
      var done = false;
      var timer = setTimeout(function(){ if (!done){ done = true; resolve(null); } }, 15000);
      try {
        if (!navigator.geolocation){ done = true; clearTimeout(timer); resolve(null); return; }
        navigator.geolocation.getCurrentPosition(function(pos){
          if (done) return; done = true; clearTimeout(timer);
          resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        }, function(){
          if (done) return; done = true; clearTimeout(timer); resolve(null);
        }, { timeout: 14000, maximumAge: 30000, enableHighAccuracy: true });
      } catch(e){
        if (!done){ done = true; clearTimeout(timer); resolve(null); }
      }
    });
  }

  // ================= REQUEST CARD (shared) =================
  function requestCard(r, showApprove, isHrStage){
    var typeLabel = r.type==="leave" ? TYPE_LABELS.leave : (TYPE_LABELS[r.subtype]||"استئذان");
    var st = STATUS_LABELS[r.status] || {text:r.status, cls:"badge-wait"};
    var metaBits = [r.date];
    if (r.hours) metaBits.push(r.hours + " ساعة");
    if (r.employeeName && showApprove) metaBits.unshift(r.employeeName);

    var children = [
      el("div", {class:"req-top"}, [
        el("div", {class:"req-type"}, [typeLabel]),
        el("span", {class:"badge " + st.cls}, [st.text])
      ]),
      el("div", {class:"req-meta"}, [metaBits.join(" · ")])
    ];
    if (r.reason) children.push(el("div", {class:"req-reason"}, [r.reason]));

    if (showApprove){
      var noteInput = el("input", {type:"text", placeholder:"ملاحظة (اختياري)"});
      var actions = el("div", {class:"req-actions"}, [
        el("button", {class:"btn btn-green btn-sm", onclick:function(){ decide(r, true, noteInput.value, isHrStage); }}, ["موافقة"]),
        el("button", {class:"btn btn-red btn-sm", onclick:function(){ decide(r, false, noteInput.value, isHrStage); }}, ["رفض"])
      ]);
      children.push(el("div",{class:"field"},[noteInput]));
      children.push(actions);
    }
    if (r.managerNote) children.push(el("div",{class:"req-note"},["ملاحظة المدير: " + r.managerNote]));
    if (r.hrNote) children.push(el("div",{class:"req-note"},["ملاحظة الموارد البشرية: " + r.hrNote]));

    return el("div", {class:"req-item"}, children);
  }

  function typeLabelFor(r){
    return r.type==="leave" ? TYPE_LABELS.leave : (TYPE_LABELS[r.subtype]||"استئذان");
  }

  function decide(r, approve, note, isHrStage){
    var update = {};
    if (isHrStage){
      update.hrNote = note || "";
      update.hrDecisionAt = Date.now();
      update.status = approve ? "approved" : "rejected";
    } else {
      update.managerNote = note || "";
      update.managerDecisionAt = Date.now();
      update.status = approve ? "pending_hr" : "rejected";
    }
    reqCol().doc(r.id).update(update).then(function(){
      var tLabel = typeLabelFor(r);
      if (isHrStage){
        if (approve){
          notify(r.employeeCode, "تمت الموافقة النهائية على طلب " + tLabel + " بتاريخ " + r.date);
          notify(r.managerCode, "الموارد البشرية وافقت على طلب " + tLabel + " لـ " + r.employeeName);
        } else {
          notify(r.employeeCode, "تم رفض طلب " + tLabel + " بتاريخ " + r.date + " من الموارد البشرية");
        }
      } else {
        if (approve){
          notify(r.employeeCode, "مديرك وافق على طلب " + tLabel + " وبانتظار اعتماد الموارد البشرية");
          listByRole("hr").then(function(list){
            list.forEach(function(h){ notify(h.code, "طلب " + tLabel + " من " + r.employeeName + " بانتظارك"); });
          });
        } else {
          notify(r.employeeCode, "تم رفض طلب " + tLabel + " بتاريخ " + r.date + " من مديرك المباشر");
        }
      }
      showToast(approve ? "تمت الموافقة" : "تم الرفض");
      reload();
    }).catch(function(){ showToast("حصل خطأ"); });
  }

          totalAmount += s.deductAmount;
          if (s.netSalary !== null) totalNet += s.netSalary;
          rows.push({name: e.name||e.code, code: e.code, leaveDays: s.leaveDays, hoursUsed: s.hoursUsed, absentDays: s.absentDays, deductDays: s.deductDays, baseSalary: e.baseSalary||0, allowances: s.allowances, fixedDeduction: s.fixedDeduction, bonusSum: s.bonusSum, manualDeductSum: s.manualDeductSum, deductAmount: Math.round(s.deductAmount*100)/100, netSalary: s.netSalary!==null ? Math.round(s.netSalary*100)/100 : ""});
          card.appendChild(el("div", {class:"list-item"}, [
            el("div", {}, [
              el("div",{class:"li-name"},[e.name||e.code]),
              el("div",{class:"li-sub"},["إجازة: " + s.leaveDays + " يوم · استئذان: " + s.hoursUsed + " س · غياب: " + s.absentDays + " يوم · خصم: " + s.deductDays + " يوم" + (s.netSalary!==null ? " · صافي: " + fmtMoney(s.netSalary) + " ج.م" : "")])
            ]),
            el("span", {class:"li-code"}, [ e.baseSalary? (fmtMoney(s.deductAmount)+" ج.م") : "—" ])
          ]));
        });
        state.reportRows = rows;
        main.appendChild(el("div",{class:"card-title"},["تفاصيل الخصومات وصافي الرواتب"]));
        main.appendChild(card);
        main.appendChild(el("div", {class:"card"}, [
          el("div", {class:"summary-grid"}, [
            summaryBox(employees.length.toString(), "عدد الموظفين", false),
            summaryBox(fmtMoney(totalAmount)+" ج.م", "إجمالي الخصومات المتوقعة", totalAmount>0),
            summaryBox(fmtMoney(totalNet)+" ج.م", "إجمالي صافي الرواتب", false)
          ])
        ]));
      });
    });
  }

  function exportMonthlyExcel(btn){
    if (typeof XLSX === "undefined"){ showToast("مكتبة Excel لسه بتحمّل، جرب تاني بعد شوية"); return; }
    var rows = state.reportRows || [];
    if (rows.length===0){ showToast("مفيش بيانات لتصديرها"); return; }
    claude.use("downloads").then(function(downloads){
      if (!downloads){ showToast("التنزيل مش متاح في الصفحة دي"); return; }
      btn.disabled = true;
      var sheetData = [["الاسم","الكود","أيام الإجازة","ساعات الاستئذان","أيام الغياب","أيام الخصم","الراتب الأساسي","البدلات","خصومات ثابتة","مكافآت الشهر","خصومات إضافية","خصم الغياب/الاستئذان","صافي الراتب"]];
      rows.forEach(function(r){
        sheetData.push([r.name, r.code, r.leaveDays, r.hoursUsed, r.absentDays, r.deductDays, r.baseSalary, r.allowances, r.fixedDeduction, r.bonusSum, r.manualDeductSum, r.deductAmount, r.netSalary]);
      });
      var ws = XLSX.utils.aoa_to_sheet(sheetData);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "التقرير");
      var arrBuf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
      downloads.save({ filename: "تقرير-" + state.month + ".xlsx", data: new Blob([arrBuf], {type:"application/octet-stream"}) })
        .then(function(){ btn.disabled = false; })
        .catch(function(err){
          btn.disabled = false;
          if (err && err.code === "declined") return;
          showToast("حصل خطأ في التصدير");
        });
    }).catch(function(){ showToast("التنزيل مش متاح دلوقتي"); });
  }
